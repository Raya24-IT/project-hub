<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>صفحة التجربة الأولى</title>
  <style>
    /* تنسيقات بسيطة لترتيب الشكل وحالات الروابط */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
      line-height: 1.6;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    /* حالات الرابط بالترتيب الصحيح */
    a:link { color: blue; font-weight: bold; text-decoration: none; }
    a:visited { color: purple; }
    a:hover { color: red; text-decoration: underline; }
    a:focus { color: green; }
    a:active { color: orange; }
  </style>
</head>
<body>

  <main class="card">
    <h1 id="main-title">مرحباً بك في أول صفحة ويب لي! 🚀</h1>
    
    <p>هذه الصفحة تجمع كل ما تعلمناه في دروس <strong>HTML</strong> الأساسية.</p>

    <figure>
      <img src="./cat.jpg.webp" alt="صورة لازانيا لذيذة" width="100%" />
      <figcaption>القطط <em>تحب</em> اللازانيا كثيراً!</figcaption>
    </figure>

    <section>
      <h2>أشياء تعلمتها اليوم:</h2>
      <ul>
        <li>الهيكل الأساسي لصفحة الويب</li>
        <li>الفرق بين <code>id</code> و <code>class</code></li>
        <li>الأحرف الخاصة مثل: &lt;p&gt; و &copy;</li>
      </ul>
    </section>

    <hr />

    <footer>
      <p>جرب تمرير الماوس أو الضغط المطوّل على هذا الرابط:</p>
      <a href="https://freecodecamp.org" target="_blank">زيارة موقع freeCodeCamp</a>
      <br><br>
      <button onclick="alert('أحسنت! الكود يعمل بنجاح 🎉')">اضغط هنا للتجربة</button>
    </footer>
  </main>

</body>
</html>
